<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.15" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#0c1018" />
  <!-- Outer shell -->
  <path
    d="M 4 4 L 96 4 L 96 96 L 4 96 Z"
    fill="#0f141d"
    stroke="#1e293b"
    stroke-width="0.35"
  />
  <!-- Internal walls (approximate) -->
  <g stroke="#243042" stroke-width="0.22" fill="none" opacity="0.95">
    <line x1="28" y1="4" x2="28" y2="90" />
    <line x1="78" y1="4" x2="78" y2="62" />
    <line x1="28" y1="18" x2="96" y2="18" />
    <line x1="60" y1="18" x2="60" y2="62" />
    <line x1="28" y1="62" x2="96" y2="62" />
    <line x1="34" y1="62" x2="34" y2="96" />
    <line x1="60" y1="62" x2="60" y2="96" />
    <line x1="16" y1="76" x2="28" y2="76" />
    <line x1="82" y1="62" x2="82" y2="96" />
  </g>
  <!-- Stage hint (east wall of auditorium) -->
  <line x1="78" y1="22" x2="78" y2="58" stroke="#334155" stroke-width="0.5" stroke-dasharray="1 1" opacity="0.5" />
  <text x="81" y="42" fill="#475569" font-size="2.2" font-family="system-ui, sans-serif" opacity="0.65">Stage</text>
  <!-- Seating direction cue (faces east) -->
  <g opacity="0.35" fill="none" stroke="#64748b" stroke-width="0.12">
    <path d="M 42 38 L 52 38 M 47 36 L 52 38 L 47 40" />
    <path d="M 42 44 L 52 44 M 47 42 L 52 44 L 47 46" />
    <path d="M 42 50 L 52 50 M 47 48 L 52 50 L 47 52" />
  </g>
</svg>
